services:
  cost-observer:
    build: .
    init: true
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: file:/data/cost-observer/data.db
    volumes: ["cost-data:/data"]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  cost-data:
